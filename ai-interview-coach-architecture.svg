  <g filter="url(#shadow)"><rect x="80" y="357" width="195" height="113" rx="18" fill="#fff"/><rect x="80" y="357" width="8" height="113" rx="4" fill="#60A5FA"/></g>
  <text x="106" y="397" class="box-title">Resume Upload</text><text x="106" y="424" class="box-text">PDF / DOCX / Text</text>
