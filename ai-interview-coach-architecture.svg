  <path d="M1010 551 H1100" class="line"/><text x="1055" y="535" text-anchor="middle" class="small">evaluate answer</text>

  <!-- footer -->
  <rect x="80" y="690" width="1440" height="120" rx="20" fill="#12263A"/>
  <text x="800" y="735" text-anchor="middle" style="font:700 23px Arial,sans-serif;fill:#fff">Workflow: Resume → AI Analysis → Personalized Questions → Chat / Voice Answer → Feedback Report</text>
  <text x="800" y="773" text-anchor="middle" style="font:400 17px Arial,sans-serif;fill:#C5D3E0">Firebase and AI API integrations can be presented as proposed future implementation during Review 1.</text>
