  <path d="M1010 276 H1100" class="line"/><text x="1055" y="260" text-anchor="middle" class="small">AI prompt</text>
  <path d="M177 327 V357" class="line"/><path d="M402 327 V357" class="line"/>
  <path d="M290 470 V500" class="line"/>
  <path d="M687 327 V357" class="line"/><path d="M912 327 V357" class="line"/>
  <path d="M800 470 V500" class="line"/>
  <path d="M1197 327 V357" class="line"/><path d="M1422 327 V357" class="line"/>
