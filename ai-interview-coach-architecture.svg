<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#EAF2FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#274060" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#61758A"/></marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill:#12263A; }
      .subtitle { font: 400 18px Arial, sans-serif; fill:#5B6D7E; }
      .group { font: 700 22px Arial, sans-serif; fill:#fff; }
      .box-title { font: 700 19px Arial, sans-serif; fill:#12263A; }
      .box-text { font: 400 15px Arial, sans-serif; fill:#506273; }
      .small { font: 400 14px Arial, sans-serif; fill:#506273; }
      .line { stroke:#61758A; stroke-width:3; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="60" text-anchor="middle" class="title">AI Interview Coach — System Architecture</text>
  <text x="800" y="91" text-anchor="middle" class="subtitle">Flutter/Dart mobile app with Firebase and AI service integration</text>

